[tools]
# Repository Management
pkl = "0.32.1"
hk = "2.5.0"
prettier = "3.9.9"
ruff = "0.16.10"
shellcheck = "0.11"
yamllint = "1.38.0"
typos = "1.51.1"
task = "3.54.0"

# Scripting
python = "3.14"
jq = "1.8"
yq = "4.54.1"
cue = "0.17.1"

# Template Rendering
pipx = "1.17.11"
'pipx:makejinja' = "2.9.1"

# Encryption Tools
sops = "3.13.3"
age = "1.3.2"

# Talos Management
talos = "1.14.2"
talhelper = "3.1.17"
"aqua:cli/cli" = "2.102.0"

# Kubernetes Tools
k9s = "0.51.0"
kubectl = "latest"
kustomize = "5.8"
kubeconform = "0.8.0"
helm = "4.3.0"
helmfile = "1.8.1"
cilium-cli = "0.20.1"
flux2 = "2.9.6"

# Cloudflare Tools
cloudflared = "2026.10.0"
talosctl = "latest"

[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
SOPS_AGE_KEY_FILE = "{{ config_root }}/age.key"
TEMPLATE_DIR = "{{ config_root }}/.mise/templates"
MAKEJINJA_SETTINGS = "{{ config_root }}/makejinja.toml"
BOOTSTRAP_DIR = "{{ config_root }}/bootstrap"
KUBERNETES_DIR = "{{ config_root }}/kubernetes"
SCRIPTS_DIR = "{{ config_root }}/scripts"
TALOS_DIR = "{{ config_root }}/talos"
PRIVATE_DIR = "{{ config_root }}/.private"
TALOSCONFIG = "{{ config_root }}/talos/clusterconfig/talosconfig"
KUBECONFIG = "{{ config_root }}/kubeconfig"

[tasks.copykubeconfig]
description = "Copies the local kubeconfig file to ~/.kube/config"
run = [
    "cp ~/.kube/config ~/.kube/config-$(date +%Y%m%d%H%M%S)",
    "cp ./kubeconfig ~/.kube/config"
]

[tasks.reconcile]
description = "Reconcile configuration changes to the cluster"
run = [
    "flux --namespace flux-system reconcile kustomization flux-system --with-source"
]

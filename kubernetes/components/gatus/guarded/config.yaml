---
endpoints:
  - name: "${APP}"
    group: guarded
    url: "https://${GATUS_SUBDOMAIN:-${APP}}.${SECRET_DOMAIN}${GATUS_PATH:-/}"
    interval: 1m
    ui:
      hide-hostname: true
      hide-url: true
    client:
      dns-resolver: tcp://10.10.10.5:53
      ignore-redirect: ${GATUS_IGNORE_REDIRECT:-true}
    conditions:
      - "[STATUS] == ${GATUS_STATUS:=200}"
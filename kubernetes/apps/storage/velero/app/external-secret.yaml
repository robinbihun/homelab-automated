---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword

  target:
    name: velero-credentials
    template:
      type: Opaque
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .accessKeyId }}
          aws_secret_access_key={{ .secretAccessKey }}

  data:
    - secretKey: accessKeyId
      remoteRef:
        key: garage-s3-backups/access_key_id
    - secretKey: secretAccessKey
      remoteRef:
        key: garage-s3-backups/secret_access_key
---
# Kopia repository encryption password. Velero looks for exactly this secret
# name/key in its own namespace. Keep a copy outside the cluster: without it
# the backups cannot be restored.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-repo-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword

  target:
    name: velero-repo-credentials
    template:
      type: Opaque

  data:
    - secretKey: repository-password
      remoteRef:
        key: garage-s3-backups/velero_repository_password

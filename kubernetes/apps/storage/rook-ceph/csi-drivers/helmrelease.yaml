---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: ceph-csi-drivers
      version: "1.0.5"
      sourceRef:
        kind: HelmRepository
        name: ceph-csi-operator
        namespace: storage
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    operatorConfig:
      namespace: storage
      driverSpecDefaults:
        imageSet:
          name: rook-csi-operator-image-set-configmap
        nodePlugin:
          priorityClassName: system-node-critical
          # Must run on every node that could mount a Ceph volume, including
          # k8s-04/05 now that they're tainted node-type=compute:NoSchedule.
          tolerations:
            - operator: Exists
        controllerPlugin:
          priorityClassName: system-cluster-critical
          # Sidecars (csi-provisioner/attacher/resizer/snapshotter) were
          # running at low-single-digit-millicore usage against 100-250m
          # requests each (2026-08-02 audit) — trimmed since these controller
          # pods are relocating to CPU-constrained control-plane nodes and
          # every reclaimed core there matters. Chart requires >=1.0.5: 1.0.1's
          # operatorConfig template mis-indents this block (nindent 8 instead
          # of 10) and renders invalid YAML for any non-empty resources map.
          resources:
            provisioner: &sidecarResources
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 256Mi
            attacher: *sidecarResources
            resizer: *sidecarResources
            snapshotter: *sidecarResources

    drivers:
      rbd:
        enabled: true
        name: storage.rbd.csi.ceph.com
        # Required for the csi-snapshotter sidecar; Velero's data mover needs it.
        snapshotPolicy: volumeSnapshot
      cephfs:
        enabled: true
        name: storage.cephfs.csi.ceph.com
        # Kernel clients only speak msgr2 when asked to; required now that the
        # CephCluster sets requireMsgr2 (mons no longer listen on 6789).
        kernelMountOptions:
          ms_mode: prefer-crc
      nfs:
        enabled: false
        name: storage.nfs.csi.ceph.com
      nvmeof:
        enabled: false
        name: storage.nvmeof.csi.ceph.com

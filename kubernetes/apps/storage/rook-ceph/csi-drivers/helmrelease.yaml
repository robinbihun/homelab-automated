---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: ceph-csi-drivers
      version: "1.0.1"
      sourceRef:
        kind: HelmRepository
        name: ceph-csi-operator
        namespace: storage
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    operatorConfig:
      namespace: storage
      driverSpecDefaults:
        imageSet:
          name: rook-csi-operator-image-set-configmap
        nodePlugin:
          priorityClassName: system-node-critical
        controllerPlugin:
          priorityClassName: system-cluster-critical

    drivers:
      rbd:
        enabled: true
        name: storage.rbd.csi.ceph.com
      cephfs:
        enabled: true
        name: storage.cephfs.csi.ceph.com
      nfs:
        enabled: false
        name: storage.nfs.csi.ceph.com
      nvmeof:
        enabled: false
        name: storage.nvmeof.csi.ceph.com

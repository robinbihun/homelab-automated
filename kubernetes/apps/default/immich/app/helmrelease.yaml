---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  chartRef:
    kind: OCIRepository
    name: immich
  interval: 1h
  values:
    controllers:
      main:
        containers:
          main:
            image:
              tag: v2.4.1
            env:
              DB_HOSTNAME: ${PGSQL_HOST}
              DB_DATABASE_NAME: immich
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-secret
                    key: db-username
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-secret
                    key: db-password
    valkey:
      enabled: true

    # machine-learning:
    #   persistence:
    #     cache:
    #       type: persistentVolumeClaim
    #       accessMode: ReadWriteOnce

    immich:
      persistence:
        library:
          existingClaim: immich-nfs-pvc
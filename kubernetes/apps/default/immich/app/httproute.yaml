---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich-internal
  namespace: default
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - photos.${SECRET_DOMAIN}
  rules:
    - backendRefs:
      - name: immich-server
        port: 2283
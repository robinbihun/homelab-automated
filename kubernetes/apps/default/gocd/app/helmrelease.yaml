---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gocd
spec:
  interval: 30m
  chart:
    spec:
      chart: gocd
      version: 2.17.1
      sourceRef:
        kind: HelmRepository
        name: gocd
        namespace: default
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    ingress:
      enabled: false
    service:
      type: "NodePort"
      httpPort: 8153

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gocd-https
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - gocd.${SECRET_DOMAIN}
  rules:
    - backendRefs:
      - name: gocd-server
        port: 8153
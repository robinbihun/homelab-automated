---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea-https
  namespace: default
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - code.${SECRET_DOMAIN}
  rules:
    - backendRefs:
      - name: gitea-http
        port: 3000
---
# NOTE: anything on port network/envoy-internal.{port} will be routed here
# There is no "hostname" option for tcp routes
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: gitea-ssh
  namespace: default
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: git-ssh
  rules:
    - backendRefs:
      - name: gitea-ssh
        port: 22

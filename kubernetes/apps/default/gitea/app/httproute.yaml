---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea-https
  namespace: default
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - code.${SECRET_DOMAIN}
  rules:
    - backendRefs:
      - name: gitea-http
        port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea-ssh
  namespace: default
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: ssh
  hostnames:
    - git.${SECRET_DOMAIN}
  rules:
    - backendRefs:
      - name: gitea-ssh
        port: 22

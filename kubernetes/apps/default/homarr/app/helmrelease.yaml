---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      homarr:
        containers:
          app:
            image:
              repository: ghcr.io/homarr-labs/homarr
              tag: v2.2.0
            env:
              AUTH_PROVIDERS: oidc
              AUTH_OIDC_ISSUER: https://id.${SECRET_DOMAIN}
              AUTH_OIDC_CLIENT_NAME: Pocket ID
              # entrypoint needs to start as root to chown /appdata, then
              # drops to this uid/gid via su-exec - can't be locked down to
              # non-root at the pod level without patching the upstream image
              PUID: "1000"
              PGID: "1000"
              AUTH_OIDC_CLIENT_ID:
                secretKeyRef:
                  name: homarr-oidc-secret
                  key: client-id
              AUTH_OIDC_CLIENT_SECRET:
                secretKeyRef:
                  name: homarr-oidc-secret
                  key: client-secret
              SECRET_ENCRYPTION_KEY:
                secretKeyRef:
                  name: homarr-secret
                  key: encryption-key
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: homarr
        ports:
          http:
            port: &port 7575
    route:
      app:
        hostnames:
          - "dash.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: homarr
                port: *port
    persistence:
      data:
        existingClaim: homarr
        globalMounts:
          - path: /appdata

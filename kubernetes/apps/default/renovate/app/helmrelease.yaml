---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
spec:
  chartRef:
    kind: OCIRepository
    name: renovate
  interval: 1h
  values:
    image:
      registry: ghcr.io
      repository: renovatebot/renovate
      tag: 42.74.1
    cronjob:
      schedule: "0 * * * *"
      concurrencyPolicy: Forbid
      failedJobsHistoryLimit: 1
      successfulJobsHistoryLimit: 1
    renovate:
      config: |
        {
          "allowPlugins": "false",
          "allowScripts": "false",
          "autodiscover": "true",
          "platform": "github"
        }
    envFrom:
      - secretRef:
          name: renovate-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: rocketchat-db-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rocketchat-db
  ports:
    - name: mongodb
      port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rocketchat-db
spec:
  serviceName: rocketchat-db-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rocketchat-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rocketchat-db
    spec:
      # MongoDB refuses to start if the keyfile is readable by anyone but
      # its own user, and a Secret volume can't be mounted pre-owned by an
      # arbitrary uid, so it's copied into an emptyDir and re-permissioned
      # here (verified locally: mongod rejects both a keyfile owned by a
      # different uid and one that's group/world-readable).
      initContainers:
        - name: keyfile-permissions
          image: mongo:8.3.11
          command:
            - sh
            - -c
            - cp /keyfile-src/replica-set-key /keyfile/key && chown 999:999 /keyfile/key && chmod 400 /keyfile/key
          volumeMounts:
            - name: keyfile-src
              mountPath: /keyfile-src
            - name: keyfile
              mountPath: /keyfile
      containers:
        - name: mongodb
          image: mongo:8.3.11
          args:
            - --replSet=rs0
            - --auth
            - --keyFile=/etc/mongodb-keyfile/key
            - --bind_ip_all
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rocketchat-db-secret
                  key: mongodb-root-password
          ports:
            - name: mongodb
              containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: keyfile
              mountPath: /etc/mongodb-keyfile
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: keyfile-src
          secret:
            secretName: rocketchat-db-secret
            items:
              - key: mongodb-replica-set-key
                path: replica-set-key
        - name: keyfile
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-block
        resources:
          requests:
            storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rocketchat-db-init
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-mongodb
          image: mongo:8.3.11
          command:
            - sh
            - -c
            - until mongosh --quiet --host rocketchat-db-0.rocketchat-db-headless --eval "db.runCommand('ping')" > /dev/null 2>&1; do echo "waiting for rocketchat-db to be reachable"; sleep 5; done
      containers:
        - name: init
          image: mongo:8.3.11
          command:
            - mongosh
            - --quiet
            - --host
            - rocketchat-db-0.rocketchat-db-headless
            - --eval
            - |
              db = db.getSiblingDB('admin');
              db.auth('root', process.env.ROOT_PASSWORD);

              try {
                rs.status();
              } catch (e) {
                rs.initiate({
                  _id: 'rs0',
                  members: [{ _id: 0, host: 'rocketchat-db-0.rocketchat-db-headless.default.svc.cluster.local:27017' }],
                });
                while (rs.status().myState !== 1) {
                  sleep(1000);
                }
              }

              const rcDb = db.getSiblingDB('rocketchat');
              if (rcDb.getUser('rocketchat') === null) {
                rcDb.createUser({
                  user: 'rocketchat',
                  pwd: process.env.APP_PASSWORD,
                  roles: [{ role: 'readWrite', db: 'rocketchat' }],
                });
              }
          env:
            # read via process.env inside the script above so credentials
            # never appear in argv/`ps` output, only as env vars
            - name: ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rocketchat-db-secret
                  key: mongodb-root-password
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rocketchat-db-secret
                  key: mongodb-password

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rocketchat-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword

  target:
    name: rocketchat-secret
    template:
      type: Opaque

  data:
    - secretKey: admin-username
      remoteRef:
        key: rocketchat-secret/admin-username
    # openssl rand -hex 32
    - secretKey: admin-password
      remoteRef:
        key: rocketchat-secret/admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rocketchat-db-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword

  target:
    name: rocketchat-db-secret
    template:
      type: Opaque

  data:
    # openssl rand -hex 32
    - secretKey: mongodb-root-password
      remoteRef:
        key: rocketchat-db-secret/mongodb-root-password
    # openssl rand -hex 32
    - secretKey: mongodb-password
      remoteRef:
        key: rocketchat-db-secret/mongodb-password
    # openssl rand -hex 32
    - secretKey: mongodb-replica-set-key
      remoteRef:
        key: rocketchat-db-secret/mongodb-replica-set-key
---
# Not wired into the HelmRelease: Rocket.Chat's OVERWRITE_SETTING_ env vars
# for Custom OAuth are unreliable (RocketChat/Rocket.Chat#25157, #10420).
# Configure Pocket ID login manually in Settings > OAuth after first login
# using these values; kept here for reference/rotation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rocketchat-oidc-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword

  target:
    name: rocketchat-oidc-secret

  data:
    - secretKey: client-id
      remoteRef:
        key: rocketchat-oidc-secret/client-id
    - secretKey: client-secret
      remoteRef:
        key: rocketchat-oidc-secret/client-secret

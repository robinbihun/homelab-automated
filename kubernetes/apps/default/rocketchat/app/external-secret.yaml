apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rocketchat-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword

  target:
    name: rocketchat-secret
    template:
      type: Opaque

  data:
    - secretKey: admin-username
      remoteRef:
        key: rocketchat-secret/admin-username
    # openssl rand -hex 32
    - secretKey: admin-password
      remoteRef:
        key: rocketchat-secret/admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rocketchat-db-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword

  target:
    name: rocketchat-db-secret
    template:
      type: Opaque
      # Merge keeps the fetched keys below as-is; template.data only adds
      # mongo-uri on top (dashes in a key name aren't valid Go template
      # identifiers, hence `index` instead of `.mongodb-password`).
      mergePolicy: Merge
      data:
        # consumed by the rocketchat HelmRelease via existingMongodbSecret
        mongo-uri: "mongodb://rocketchat:{{ index . \"mongodb-password\" }}@rocketchat-db-0.rocketchat-db-headless.default.svc.cluster.local:27017/rocketchat?replicaSet=rs0&authSource=rocketchat"

  data:
    # openssl rand -hex 32
    - secretKey: mongodb-root-password
      remoteRef:
        key: rocketchat-db-secret/mongodb-root-password
    # openssl rand -hex 32
    - secretKey: mongodb-password
      remoteRef:
        key: rocketchat-db-secret/mongodb-password
    # openssl rand -hex 32
    - secretKey: mongodb-replica-set-key
      remoteRef:
        key: rocketchat-db-secret/mongodb-replica-set-key

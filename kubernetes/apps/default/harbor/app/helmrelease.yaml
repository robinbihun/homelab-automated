---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
spec:
  interval: 30m
  chart:
    spec:
      chart: harbor
      version: 1.18.2
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: default
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    expose:
      type: route
      tls:
        enabled: false
      route:
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        hosts:
          - registry.${SECRET_DOMAIN}
    externalURL: https://registry.${SECRET_DOMAIN}

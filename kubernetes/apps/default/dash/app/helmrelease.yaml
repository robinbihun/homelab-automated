---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dash
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      dash:
        containers:
          app:
            image:
              repository: ghcr.io/oechsler/dash
              tag: latest
            env:
              APP_ENV: prod
              APP_PORT: "8080"
              OIDC_ISSUER: https://id.${SECRET_DOMAIN}
              OIDC_REDIRECT_URL: https://dash.${SECRET_DOMAIN}/session/login/callback
              OIDC_SCOPES: "openid profile email groups"
              OIDC_ADMIN_GROUP: dash_admins
              OIDC_COOKIE_NAME: __Secure-dash-session
              OIDC_COOKIE_DOMAIN: dash.${SECRET_DOMAIN}
              OIDC_COOKIE_SECURE: "true"
              OIDC_COOKIE_MAX_AGE: "0"
              DATABASE_URL:
                secretKeyRef:
                  name: dash-db-secret
                  key: database-url
              OIDC_CLIENT_ID:
                secretKeyRef:
                  name: dash-oidc-secret
                  key: client-id
              OIDC_CLIENT_SECRET:
                secretKeyRef:
                  name: dash-oidc-secret
                  key: client-secret
              OIDC_COOKIE_HASH_KEY:
                secretKeyRef:
                  name: dash-secret
                  key: cookie-hash-key
              OIDC_COOKIE_BLOCK_KEY:
                secretKeyRef:
                  name: dash-secret
                  key: cookie-block-key
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/dash/healthcheck"]
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: dash
        ports:
          http:
            port: &port 8080
    route:
      app:
        hostnames:
          - "dash.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: dash
                port: *port

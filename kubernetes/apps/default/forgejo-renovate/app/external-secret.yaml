apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-renovate-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword

  target:
    name: forgejo-renovate-secrets

  data:
    - secretKey: RENOVATE_GITHUB_COM_TOKEN
      remoteRef:
        key: forgejo-renovate-secrets/RENOVATE_GITHUB_COM_TOKEN
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: forgejo-renovate-secrets/RENOVATE_TOKEN
    - secretKey: RENOVATE_GIT_PRIVATE_KEY
      remoteRef:
        key: forgejo-renovate-secrets/RENOVATE_GIT_PRIVATE_KEY

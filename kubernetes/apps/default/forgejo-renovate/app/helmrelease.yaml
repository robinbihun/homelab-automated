---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-renovate
spec:
  chartRef:
    kind: OCIRepository
    name: renovate
  interval: 1h
  values:
    image:
      registry: ghcr.io
      repository: renovatebot/renovate
      tag: 42.99.0
    cronjob:
      schedule: "0 0 * * *"
      concurrencyPolicy: Forbid
      failedJobsHistoryLimit: 1
      successfulJobsHistoryLimit: 1
    renovate:
      config: |
        {
          "allowPlugins": "false",
          "allowScripts": "false",
          "autodiscover": "true",
          "platform": "forgejo",
          "endpoint": "https://code.${SECRET_DOMAIN}/",
          "extends": [
            ":configMigration",
            ":ignoreModulesAndTests",
            "group:recommended",
            "group:allNonMajor",
            "helpers:githubDigestChangelogs",
            "helpers:goXPackagesChangelogLink",
            "helpers:goXPackagesNameLink",
            "workarounds:all"
          ]
        }
    envFrom:
      - secretRef:
          name: forgejo-renovate-secrets
---
# 7d observed usage (2026-08-02 audit): patroni ~148Mi p95, cluster-controller
# ~123Mi p95, combined pod well under the auto-generated keycloak-db-default
# profile's 2Gi/1cpu. This profile replaces that default with sizing based on
# real usage, with headroom for query/cache growth.
apiVersion: stackgres.io/v1
kind: SGInstanceProfile
metadata:
  name: keycloak-db-small
spec:
  cpu: '500m'
  memory: '1Gi'
---
apiVersion: stackgres.io/v1
kind: SGCluster
metadata:
  name: keycloak-db
spec:
  instances: 1
  postgres:
    version: '18'
  sgInstanceProfile: keycloak-db-small
  pods:
    persistentVolume:
      size: '2Gi'
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-db-init
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: postgres:18
          command:
            - /bin/sh
            - -c
            - until psql -h keycloak-db.default.svc.cluster.local -U postgres -c "SELECT 1" > /dev/null 2>&1; do echo "waiting for keycloak-db to be fully initialized"; sleep 10; done 
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: superuser-username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: superuser-password
      containers:
        - name: init
          image: postgres:18
          command:
            - psql
            - -h
            - keycloak-db.default.svc.cluster.local
            - -U
            - postgres
            - -f
            - /scripts/init.sql
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: superuser-username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: superuser-password
          volumeMounts:
            - name: init-sql
              mountPath: /scripts
      volumes:
        - name: init-sql
          secret:
            secretName: keycloak-db-secret
            items:
              - key: db-init-sql
                path: init.sql
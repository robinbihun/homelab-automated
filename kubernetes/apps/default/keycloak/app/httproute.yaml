---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-internal
  namespace: default
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - auth.${SECRET_DOMAIN}
  rules:
    - backendRefs:
      - name: keycloak
        port: 8080
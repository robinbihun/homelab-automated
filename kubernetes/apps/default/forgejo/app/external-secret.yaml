apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword

  target:
    name: forgejo-admin-secret

  data:
    - secretKey: username
      remoteRef:
        key: forgejo-admin-secret/username
    - secretKey: password
      remoteRef:
        key: forgejo-admin-secret/password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-config-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword

  target:
    name: forgejo-config-secret
    template:
      type: Opaque

  data:
    - secretKey: database
      remoteRef:
        key: forgejo-config-secret/database
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-db-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword

  target:
    name: forgejo-db-secret
    template:
      type: Opaque

  data:
    - secretKey: db-username
      remoteRef:
        key: forgejo-db-secret/db-username
    - secretKey: db-password
      remoteRef:
        key: forgejo-db-secret/db-password
    - secretKey: db-init-sql
      remoteRef:
        key: forgejo-db-secret/db-init-sql
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-s3-backups
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword

  target:
    name: garage-s3-backups
    template:
      type: Opaque

  data:
    - secretKey: accessKeyId
      remoteRef:
        key: garage-s3-backups/access_key_id
    - secretKey: secretAccessKey
      remoteRef:
        key: garage-s3-backups/secret_access_key

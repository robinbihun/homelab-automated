---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: gpt-oss-20b
spec:
  source: https://huggingface.co/unsloth/gpt-oss-20b-GGUF/resolve/main/gpt-oss-20b-Q4_K_M.gguf
  format: gguf
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: gpt-oss-20b
spec:
  modelRef: gpt-oss-20b
  replicas: 1
  contextSize: 8192
  nodeSelector:
    node-type: compute
  resources:
    cpu: "8"
    memory: "14Gi"

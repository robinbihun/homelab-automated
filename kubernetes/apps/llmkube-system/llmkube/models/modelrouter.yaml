---
apiVersion: inference.llmkube.dev/v1alpha1
kind: ModelRouter
metadata:
  name: llmrouter
spec:
  backends:
    - name: gpt-oss-20b
      tier: local
      capabilities: ["tools"]
      inferenceServiceRef:
        name: gpt-oss-20b
    - name: claude
      tier: cloud
      capabilities: ["tools", "long-context"]
      external:
        provider: anthropic
        model: claude-opus-4-8
        credentialsSecretRef:
          name: anthropic-credentials
  rules:
    - name: complex-to-claude
      match:
        taskComplexity: complex
      route:
        backends: ["claude"]
        strategy: primary-fallback
      timeout: 120s
  defaultRoute: gpt-oss-20b
  defaultRouteStrategy: BackendNameMatch
  proxy:
    image: ghcr.io/defilantech/llmkube-router-proxy:0.9.0

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
  namespace: llm
spec:
  interval: 15m
  chart:
    spec:
      chart: llmkube
      version: 0.9.0
      sourceRef:
        kind: HelmRepository
        name: llmkube
        namespace: llmkube-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    modelCache:
      storageClass: ceph-filesystem
      accessMode: ReadWriteMany

---
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

endpoints:
  - name: flux-webhook
    group: external
    url: https://flux-webhook.bihun.dev
    interval: 1m
    client:
      dns-resolver: tcp://1.1.1.1:53
    conditions:
      - "[STATUS] == 404"

metrics: true

ui:
  title: Status | Gatus
  header: Status
  logo: https://avatars.githubusercontent.com/u/138997?v=4
  link: https://github.com/robinbihun
  buttons:
    - name: Github
      link: https://github.com/robinbihun

    - name: Homelab
      link: https://github.com/robinbihun/homelab-automated

web:
  port: ${GATUS_WEB_PORT}
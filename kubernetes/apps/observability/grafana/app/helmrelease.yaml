---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: grafana
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    deploymentStrategy:
      type: Recreate
    admin:
      existingSecret: grafana-admin-secret
      userKey: admin-user
      passwordKey: admin-password
    env:
      GF_DATE_FORMATS_USE_BROWSER_LOCALE: true
      GF_EXPLORE_ENABLED: true
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: natel-discrete-panel,pr0ps-trackmap-panel,panodata-map-panel
      GF_SECURITY_ANGULAR_SUPPORT_ENABLED: true
      GF_SERVER_ROOT_URL: https://grafana.${SECRET_DOMAIN}
    envValueFrom:
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
        secretKeyRef:
          name: grafana-oidc-secret
          key: client-id
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secretKeyRef:
          name: grafana-oidc-secret
          key: client-secret
    grafana.ini:
      analytics:
        check_for_updates: false
        check_for_plugin_updates: false
        reporting_enabled: false
      auth:
        # the bootstrap admin account (grafana-admin-secret) shares its
        # login/email with the OIDC identity of the same person; without this,
        # OAuth login collides with that local account instead of linking to
        # it (https://github.com/grafana/grafana/issues/111139)
        oauth_allow_insecure_email_lookup: true
      auth.anonymous:
        enabled: true
        org_id: 1
        org_name: Main Org.
        org_role: Viewer
      auth.generic_oauth:
        enabled: true
        name: Pocket ID
        allow_sign_up: true
        auto_login: false
        use_pkce: true
        scopes: "openid email profile groups"
        auth_url: https://id.${SECRET_DOMAIN}/authorize
        token_url: https://id.${SECRET_DOMAIN}/api/oidc/token
        api_url: https://id.${SECRET_DOMAIN}/api/oidc/userinfo
        signout_redirect_url: https://id.${SECRET_DOMAIN}/api/oidc/end-session
        email_attribute_path: email
        login_attribute_path: preferred_username
        name_attribute_path: name
        groups_attribute_path: groups
        allowed_groups: "grafana_admins, grafana_users"
        role_attribute_path: "contains(groups[*], 'grafana_admins') && 'Admin' || 'Viewer'"
        role_attribute_strict: true
      news:
        news_feed_enabled: false
    datasources:
      datasources.yaml:
        apiVersion: 1
        deleteDatasources:
          - {name: Alertmanager, orgId: 1}
          - {name: Loki, orgId: 1}
          - {name: Prometheus, orgId: 1}
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            access: proxy
            url: http://prometheus-operated.observability.svc.cluster.local:9090
            isDefault: true
          - name: Loki
            type: loki
            uid: loki
            access: proxy
            url: http://loki-headless.observability.svc.cluster.local:3100
            jsonData:
              maxLines: 250
          - name: Alertmanager
            type: alertmanager
            uid: alertmanager
            access: proxy
            url: http://alertmanager-operated.observability.svc.cluster.local:9093
            jsonData:
              implementation: prometheus
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
    dashboards:
      default:
        ceph-cluster:
          gnetId: 2842
          revision: 18
          datasource: Prometheus
        ceph-osd:
          gnetId: 5336
          revision: 9
          datasource: Prometheus
        ceph-pools:
          gnetId: 5342
          revision: 9
          datasource: Prometheus
        cert-manager:
          gnetId: 20842
          revision: 3
          datasource: Prometheus
        cloudflared:
          gnetId: 17457
          revision: 6
          datasource:
            - {name: DS_PROMETHEUS, value: Prometheus}
        # envoy-gateway:
        #   url: https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-addons-helm/dashboards/envoy-gateway-global.json
        #   datasource: Prometheus
        # envoy-proxy:
        #   url: https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-addons-helm/dashboards/envoy-proxy-global.json
        #   datasource: Prometheus
        external-dns:
          gnetId: 15038
          revision: 3
          datasource: Prometheus
        kubernetes-api-server:
          gnetId: 15761
          revision: 19
          datasource: Prometheus
        kubernetes-coredns:
          gnetId: 15762
          revision: 21
          datasource: Prometheus
        kubernetes-global:
          gnetId: 15757
          revision: 43
          datasource: Prometheus
        kubernetes-namespaces:
          gnetId: 15758
          revision: 42
          datasource: Prometheus
        kubernetes-nodes:
          gnetId: 15759
          revision: 40
          datasource: Prometheus
        kubernetes-pods:
          gnetId: 15760
          revision: 36
          datasource: Prometheus
        kubernetes-volumes:
          gnetId: 11454
          revision: 14
          datasource: Prometheus
        node-exporter-full:
          gnetId: 1860
          revision: 41
          datasource:
            - {name: DS_PROMETHEUS, value: Prometheus}
        prometheus:
          gnetId: 19105
          revision: 7
          datasource: Prometheus
    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL
        label: grafana_dashboard
        folderAnnotation: grafana_folder
        provider:
          disableDelete: true
          foldersFromFilesStructure: true
      datasources:
        enabled: true
        searchNamespace: ALL
        labelValue: ""
    plugins:
      - grafana-clock-panel
      - grafana-piechart-panel
      - grafana-worldmap-panel
      - natel-discrete-panel
      - pr0ps-trackmap-panel
      - vonage-status-panel
    serviceMonitor:
      enabled: true
    route:
      main:
        enabled: false
    persistence:
      enabled: false
    testFramework:
      enabled: false
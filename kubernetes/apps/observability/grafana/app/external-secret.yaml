apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword

  target:
    name: grafana-admin-secret

  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana-admin-secret/admin-user
    - secretKey: admin-password
      remoteRef:
        key: grafana-admin-secret/admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword

  target:
    name: grafana-oidc-secret

  data:
    - secretKey: client-id
      remoteRef:
        key: grafana-oidc-secret/client-id
    - secretKey: client-secret
      remoteRef:
        key: grafana-oidc-secret/client-secret

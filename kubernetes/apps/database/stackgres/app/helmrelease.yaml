---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stackgres
spec:
  interval: 30m
  chart:
    spec:
      chart: stackgres-operator
      version: 1.18.1
      sourceRef:
        kind: HelmRepository
        name: stackgres-charts
        namespace: database
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    authentication:
      user: admin
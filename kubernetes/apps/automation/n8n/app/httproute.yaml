---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n-internal
  namespace: automation
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - n8n.${SECRET_DOMAIN}
  rules:
    - backendRefs:
      - name: n8n
        port: 80

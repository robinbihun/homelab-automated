---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: busabase
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      busabase:
        replicas: 1
        # busabase's embedded PGlite database only allows one process to
        # hold it at a time, so an overlapping RollingUpdate pod would fail
        # to start - Recreate ensures the old pod is gone first.
        strategy: Recreate
        pod:
          securityContext:
            # image runs as uid 1001 / gid 999 (nextjs); the ceph-block PVC
            # mounts owned by root:root by default, so fsGroup is needed for
            # the container to write to /data.
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: docker.io/busabase/busabase
              tag: 0.90.2
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: busabase
        ports:
          http:
            port: &port 15419
    route:
      app:
        hostnames:
          - "ai-base.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: busabase
                port: *port
    persistence:
      data:
        existingClaim: busabase
        globalMounts:
          - path: /data

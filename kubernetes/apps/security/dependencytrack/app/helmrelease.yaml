---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dependency-track
spec:
  interval: 1h
  chart:
    spec:
      chart: dependency-track
      version: 0.46.0
      sourceRef:
        kind: HelmRepository
        name: dependency-track
        namespace: security
  maxHistory: 2
  install:
    remediation:
      retries: 2
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    apiServer:
      resources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          memory: 2Gi
      extraEnv:
        - name: "ALPINE_DATABASE_MODE"
          value: "external"
        - name: "ALPINE_DATABASE_URL"
          value: "jdbc:postgresql://dtrack-db.security.svc.cluster.local:5432/dtrack"
        - name: "ALPINE_DATABASE_DRIVER"
          value: "org.postgresql.Driver"
        - name: "ALPINE_DATABASE_USERNAME"
          valueFrom:
            secretKeyRef:
              name: dtrack-secrets
              key: db-username
        - name: "ALPINE_DATABASE_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: dtrack-secrets
              key: db-password
    httpRoute:
      enabled: true
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https
      hostnames:
        - dtrack.${SECRET_DOMAIN}
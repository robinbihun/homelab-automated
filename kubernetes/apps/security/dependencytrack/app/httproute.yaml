---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dependency-track-api
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - dtrack-api.${SECRET_DOMAIN}
  rules:
    - backendRefs:
      - name: dependency-track-api-server
        port: 8080
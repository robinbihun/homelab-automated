apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-dns-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword

  target:
    name: cloudflare-dns-secret

  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare-dns-secret/api-token

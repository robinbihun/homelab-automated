---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      unifi:
        pod:
          # broadcast device-discovery (10001/udp) never crosses the pod
          # network overlay - Cilium's L2 announcement only ARPs for the
          # Service VIP, it doesn't forward general LAN broadcast traffic.
          # hostNetwork puts the pod on the node's real interface, which
          # already receives that broadcast since the nodes sit on the LAN
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
        containers:
          app:
            image:
              # linuxserver/unifi-network-application requires an external
              # MongoDB and hangs waiting for MONGO_HOST otherwise; this
              # image bundles its own, matching how a physical controller
              # behaves as a single self-contained unit
              repository: jacobalberty/unifi
              tag: v10.0.162
            env:
              # image auto-imports this cert into its Java keystore
              # (/unifi/data/keystore) any time it changes, replacing the
              # self-signed default - reuses the cluster's existing wildcard
              # cert rather than issuing a dedicated one
              CERTNAME: tls.crt
              CERT_PRIVATE_NAME: tls.key
              CERT_IS_CHAIN: "true"
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi
    service:
      app:
        controller: unifi
        type: LoadBalancer
        annotations:
          # pinned: the pool covers the whole /24, which includes
          # statically-assigned LAN devices (e.g. TrueNAS at .2) -
          # auto-allocation isn't safe here, see envoy-internal/-external
          lbipam.cilium.io/ips: "10.10.10.43"
        ports:
          https:
            port: 8443
          inform:
            port: 8080
          stun:
            port: 3478
            protocol: UDP
          discovery:
            port: 10001
            protocol: UDP
    route:
      app:
        hostnames:
          - "unifi.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: unifi
                port: 8443
    persistence:
      data:
        existingClaim: unifi
        globalMounts:
          - path: /unifi/data
      cert:
        type: secret
        name: "${SECRET_DOMAIN/./-}-production-tls"
        globalMounts:
          - path: /unifi/cert
            readOnly: true

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      unifi:
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/unifi-network-application
              tag: 10.6.101
            env:
              # entrypoint needs to start as root to chown /config, then
              # drops to this uid/gid - can't be locked down to non-root at
              # the pod level without patching the upstream image
              PUID: "1000"
              PGID: "1000"
              # unset: uses the bundled MongoDB instead of an external one
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi
    service:
      app:
        controller: unifi
        type: LoadBalancer
        ports:
          https:
            port: 8443
          inform:
            port: 8080
          stun:
            port: 3478
            protocol: UDP
          discovery:
            port: 10001
            protocol: UDP
    persistence:
      config:
        existingClaim: unifi
        globalMounts:
          - path: /config

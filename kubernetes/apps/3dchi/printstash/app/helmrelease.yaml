---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: printstash
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      api:
        pod:
          # The NAS's NFS export root_squashes to uid 1000 / gid 3000 (verified
          # live: root gets mapped down to that identity, and the exported
          # /files and /backups dirs are owned 1000:3000 with no group/other
          # write bit). The image's entrypoint normally starts as root and
          # self-chowns /data/* to uid 10001, but chown-ing an NFS path you
          # don't already own fails under root_squash regardless of client
          # privilege — CAP_CHOWN isn't honored across the wire. Running the
          # container as 1000:3000 from the start skips that entrypoint
          # chown branch entirely (id -u != 0) and matches the NFS owner
          # directly. fsGroup covers the ceph-block PVC (thumbs/staging/db),
          # which a fresh RBD volume otherwise mounts root-owned.
          securityContext:
            runAsUser: 1000
            runAsGroup: 3000
            runAsNonRoot: true
            fsGroup: 3000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          api:
            image:
              repository: ghcr.io/xiao-villamor/printstash-api
              tag: 0.11.1
            env:
              TZ: America/Chicago
              VAULT_STORAGE_BACKEND: local
              VAULT_DATA_DIR: /data/files
              VAULT_THUMB_DIR: /data/thumbs
              VAULT_STAGING_DIR: /data/staging
              VAULT_BACKUP_DIR: /data/backups
              VAULT_BACKUP_RETENTION_DAYS: "30"
              VAULT_DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: printstash-db-secret
                    key: db-url
              VAULT_JWT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: printstash-secret
                    key: jwt-secret
              VAULT_SESSION_COOKIE_SECURE: "true"
              VAULT_MAX_UPLOAD_MB: "512"
              VAULT_OIDC_ENABLED: "true"
              VAULT_OIDC_ISSUER_URL: https://auth.${SECRET_DOMAIN}/realms/development-services
              VAULT_OIDC_CLIENT_ID: printstash
              VAULT_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: printstash-secret
                    key: oidc-client-secret
              VAULT_OIDC_GROUPS_CLAIM: groups
              VAULT_OIDC_ADMIN_GROUPS: /admins
              VAULT_OIDC_DISPLAY_NAME: Sign in with SSO
              # Set explicitly rather than relying on proxy discovery: envoy
              # terminates TLS and talks plain HTTP to the frontend Service,
              # so the frontend nginx's own $scheme (forwarded as
              # X-Forwarded-Proto) would otherwise read "http" even for a
              # real HTTPS request, breaking OIDC callback construction.
              VAULT_OIDC_REDIRECT_URI: https://printstash.${SECRET_DOMAIN}/api/v1/auth/oidc/callback
              # api is ClusterIP-only, reachable exclusively via the frontend's
              # nginx same-namespace proxy_pass (never directly from outside
              # the cluster), so trusting forwarded headers from any peer here
              # is safe.
              FORWARDED_ALLOW_IPS: "*"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 8000
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 8000
                  initialDelaySeconds: 5
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 8000
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
      frontend:
        containers:
          frontend:
            image:
              repository: ghcr.io/xiao-villamor/printstash-frontend
              tag: 0.11.1
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            env:
              NGINX_CLIENT_MAX_BODY_SIZE: 512m
            probes:
              liveness: &frontend-probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *frontend-probe
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

    service:
      api:
        forceRename: api
        controller: api
        ports:
          http:
            port: 8000
      frontend:
        forceRename: printstash
        controller: frontend
        ports:
          http:
            port: 3000

    route:
      app:
        hostnames:
          - printstash.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: printstash
                port: 3000

    persistence:
      # Local (ceph-block) volume for thumbnails, staging, and the db dir
      # (entrypoint marker + auto-generated VAULT_SECRETS_KEY). See pvc.yaml
      # for why these stay off NFS.
      data:
        existingClaim: printstash
        advancedMounts:
          api:
            api:
              - path: /data/thumbs
                subPath: thumbs
              - path: /data/staging
                subPath: staging
              - path: /data/db
                subPath: db
      # Vault library assets, mirrored in place on the NAS.
      vault-files:
        type: nfs
        server: ${NFS_HOST}
        path: /mnt/Storage/Files/k8s/apps/3dchi/printstash/files
        advancedMounts:
          api:
            api:
              - path: /data/files
      # Backup archives, also on the NAS.
      vault-backups:
        type: nfs
        server: ${NFS_HOST}
        path: /mnt/Storage/Files/k8s/apps/3dchi/printstash/backups
        advancedMounts:
          api:
            api:
              - path: /data/backups

---
apiVersion: stackgres.io/v1
kind: SGCluster
metadata:
  name: printstash-db
spec:
  instances: 1
  postgres:
    version: '18'
  pods:
    persistentVolume:
      size: '2Gi'
---
apiVersion: batch/v1
kind: Job
metadata:
  name: printstash-db-init
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: postgres:18
          command:
            - /bin/sh
            - -c
            - until psql -h printstash-db.3dchi.svc.cluster.local -U postgres -c "SELECT 1" > /dev/null 2>&1; do echo "waiting for printstash-db to be fully initialized"; sleep 10; done
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: printstash-db
                  key: superuser-username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: printstash-db
                  key: superuser-password
      containers:
        - name: init
          image: postgres:18
          command:
            - psql
            - -h
            - printstash-db.3dchi.svc.cluster.local
            - -U
            - postgres
            - -f
            - /scripts/init.sql
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: printstash-db
                  key: superuser-username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: printstash-db
                  key: superuser-password
          volumeMounts:
            - name: init-sql
              mountPath: /scripts
      volumes:
        - name: init-sql
          secret:
            secretName: printstash-db-secret
            items:
              - key: db-init-sql
                path: init.sql

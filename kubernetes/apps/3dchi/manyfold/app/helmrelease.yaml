---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: manyfold
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      manyfold:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/manyfold3d/manyfold-solo
              tag: 0.130.2
            env:
              TZ: "America/Chicago"

              DATABASE_ADAPTER: postgresql
              DATABASE_HOST: ${PGSQL_HOST}
              DATABASE_PORT: "5432"
              DATABASE_NAME: "manyfold"

              REDIS_URL: ${REDIS_HOST}/2

              PUID: 1000
              PGID: 1000
            
            ## DATABASE_USER, DATABASE_PASSWORD, SECRET_KEY_BASE are set via
            envFrom:
              - secretRef:
                  name: manyfold-secrets
            
            resources:
              requests:
                cpu: 1
                memory: 1Gi
              limits:
                cpu: 2
                memory: 3Gi
        # pod:
        #   securityContext:
        #     runAsUser: 1000
        #     runAsGroup: 1000
        #     fsGroup: 1000
        #     fsGroupChangePolicy: "OnRootMismatch"

    service:
      app:
        controller: manyfold
        ports:
          http:
            port: &port 3214

    route:
      app:
        hostnames:
          - prints.bihun.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
        - backendRefs:
            - name: manyfold
              port: *port

    persistence:
      config:
        existingClaim: manyfold-pvc
      library:
        type: nfs
        server: ${NFS_HOST}
        path: /mnt/storage/files/apps/3dchi
        advancedMounts:
          manyfold:
            app:
              - subPath: manyfold
                path: /libraries

    # defaultPodOptions:
    #   securityContext:
    #     runAsNonRoot: true
    #     runAsUser: 1000
    #     runAsGroup: 1000
    #     fsGroup: 1000
    #     fsGroupChangePolicy: OnRootMismatch